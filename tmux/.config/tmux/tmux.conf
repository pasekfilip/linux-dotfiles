# =============================================================================
# tmux config — self-contained (does NOT source omarchy's default)
#
# Reload after editing:  prefix + q     (prefix is Ctrl+a)
# List every binding:    prefix + ?
# Check a value:         tmux show -g <option>
# Docs:                  man tmux, section "OPTIONS"
# =============================================================================


# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------
# chill with default

# unbind C-b
# set -g prefix C-Space
# bind -N "Send a literal C-Space" C-Space send-prefix


# -----------------------------------------------------------------------------
# Colors
# -----------------------------------------------------------------------------
# Two separate things, often confused:
#
#   default-terminal   = the TERM value tmux sets *inside* panes. Apps read it
#                        to learn what tmux itself can do. tmux-256color is the
#                        correct entry (screen-256color is the legacy fallback).
#
#   terminal-features  = what tmux should believe the *outer* terminal (ghostty)
#                        is capable of, keyed by the outer TERM. "RGB" declares
#                        24-bit color, so tmux forwards true-color escapes
#                        instead of quantizing them to the 256-color cube.
#
# The ",*:RGB" leading comma is not a typo — it's an empty first list element,
# the idiom for appending to these comma-separated option lists.
# Use `set -as` (append-string) here, not `terminal-overrides`, which is the
# older mechanism kept only for backwards compatibility.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# OSC 52 clipboard passthrough — lets nvim's yank reach the system clipboard
# even over ssh, by having the terminal do the copying.
set -as terminal-features ",*:clipboard"


# -----------------------------------------------------------------------------
# Extended (CSI-u) keys
# -----------------------------------------------------------------------------
# Classic terminals cannot represent Ctrl+Shift+<letter> — Ctrl+Shift+S and
# Ctrl+S produce identical bytes. CSI-u is the modern encoding that disambiguates
# them.
#
# The full chain for a binding like Ctrl+Shift+S below:
#   ghostty  ~/.config/ghostty/config: `keybind = ctrl+shift+s=csi:115;6u`
#            emits the escape sequence  ESC [ 115 ; 6 u   (115 = 's', 6 = ctrl+shift)
#   tmux     `extended-keys on` makes it parse that back into the key `C-S-s`
#   binding  `bind -n C-S-s ...` matches
#
# So the ghostty keybinds and these tmux binds are two halves of one mechanism —
# changing one without the other silently breaks the key.
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-ghostty:extkeys"


# -----------------------------------------------------------------------------
# General behavior
# -----------------------------------------------------------------------------
set -g mouse on                  # click to select pane, drag borders, scroll
set -g base-index 1              # windows start at 1 — matches the number row
setw -g pane-base-index 1        # ...and panes too
set -g renumber-windows on       # close window 2 of 3 and 3 becomes the new 2
set -g history-limit 50000       # scrollback lines per pane
set -g focus-events on           # forward focus in/out — nvim's autoread needs it
set -g set-clipboard on          # allow apps to set the clipboard via OSC 52
set -g allow-passthrough on      # let apps emit raw escapes (image protocols etc.)
setw -g aggressive-resize on     # size to the smallest client *viewing* a window
set -g detach-on-destroy off     # killing a session drops you to another, not out

# How long tmux waits after ESC to decide "escape key" vs "start of an escape
# sequence". 0 can misread fast terminal output; 10ms is imperceptible to you
# but enough for tmux. (Omarchy's config sets this twice with different values —
# a latent bug. Set it once.)
set -sg escape-time 10


# -----------------------------------------------------------------------------
# Copy mode (vi keys)
# -----------------------------------------------------------------------------
# prefix + [   enter copy mode      q   leave it
# v begin selection, y copy and exit, / search
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection"  -T copy-mode-vi y send -X copy-selection-and-cancel


# -----------------------------------------------------------------------------
# Bindings — no prefix (Ctrl+Shift+*, paired with ghostty's CSI-u keybinds)
# -----------------------------------------------------------------------------
# `-n` means "no prefix needed". Use it sparingly: an `-n` binding is stolen
# from every application running inside tmux. Ctrl+Shift is safe because almost
# no TUI binds it; Alt is NOT safe, which is why omarchy's Alt bindings are
# dropped here (they were eating Alt+Enter from Claude Code and nvim).

# Panes
bind -N "Split pane right" -n C-S-s split-window -h -c "#{pane_current_path}"
bind -N "Split pane down"  -n C-S-- split-window -v -c "#{pane_current_path}"
bind -N "Kill pane"        -n C-S-w kill-pane

bind -N "Focus pane left"  -n C-S-h select-pane -L
bind -N "Focus pane down"  -n C-S-j select-pane -D
bind -N "Focus pane up"    -n C-S-k select-pane -U
bind -N "Focus pane right" -n C-S-l select-pane -R

bind -N "Resize pane left"  -n C-S-Left  resize-pane -L 5
bind -N "Resize pane right" -n C-S-Right resize-pane -R 5
bind -N "Resize pane down"  -n C-S-Down  resize-pane -D 5
bind -N "Resize pane up"    -n C-S-Up    resize-pane -U 5

# Windows (these were wezterm's tabs)
bind -N "Create window"     -n C-S-t new-window -c "#{pane_current_path}"
bind -N "Previous window"   -n C-S-p previous-window
bind -N "Next window"       -n C-S-n next-window
bind -N "Move window left"  -n C-S-, swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n C-S-. swap-window -t +1 \; select-window -t +1
bind -N "Rename window"     -n C-S-r command-prompt -I "#W" "rename-window -- '%%'"

bind -N "Switch to window 1" -n C-1 select-window -t 1
bind -N "Switch to window 2" -n C-2 select-window -t 2
bind -N "Switch to window 3" -n C-3 select-window -t 3
bind -N "Switch to window 4" -n C-4 select-window -t 4
bind -N "Switch to window 5" -n C-5 select-window -t 5

# Copy mode / search. Ctrl+Shift+F opens straight into a search prompt, which is
# what wezterm's Search action did. Press q to leave copy mode.
bind -N "Copy mode"         -n C-S-x copy-mode
bind -N "Search scrollback" -n C-S-f copy-mode \; command-prompt -T search -p "(search up)" "send -X search-backward '%%%'"


# -----------------------------------------------------------------------------
# Bindings — with prefix (Ctrl+a, then the key)
# -----------------------------------------------------------------------------
# Reloading is ADDITIVE, and this trips people up: source-file re-runs every
# `set` and `bind` in the file, but it never removes anything. Options you
# changed do take effect; a binding you deleted or renamed stays live, because
# nothing told the server to forget it. So after a few edits the running server
# is the union of every version you've sourced, and the config stops matching
# what you see on screen.
#
# Changed a value?         reload is enough.
# Deleted/renamed a bind?  `unbind <key>` by hand, or `tmux kill-server` to
#                          start clean (sessions go with it -- detach first if
#                          something is running).
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show keybindings" ? display-popup -E -w 80% -h 70% -T "Keybindings" "tmux list-keys -N | sort | less -R"

# Splits. -v stacks panes top/bottom; -h places them side by side.
bind -N "Split pane down"  h split-window -v -c "#{pane_current_path}"
bind -N "Split pane right" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane"        x kill-pane

bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window"   k kill-window
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"

# Sessions.
#
# This file does NOT unbind tmux's defaults, so the stock session bindings are
# all still live alongside the ones below -- worth knowing before adding more:
#
#   prefix s   choose-tree -Zs   session/window tree, zoomed. THE session list.
#   prefix w   choose-tree -Zw   same tree, opened on windows
#   prefix d   detach-client     leave the session running, drop out of it
#   prefix D   choose-client     pick which attached client to detach
#   prefix z   resize-pane -Z    zoom the current pane
#   prefix (   prefix )          previous / next session (same as P / N below)
#
# Inside the `prefix s` tree: Enter switches, x kills the highlighted item,
# t tags and X kills every tagged item, f filters, C-s searches by name,
# v toggles the preview pane, q leaves.
bind -N "Rename session"   R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session"   C new-session -c "#{pane_current_path}"
bind -N "Kill session"     K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session"     N switch-client -n

# Unified switcher: live sessions first, then zoxide directories without one.
# Enter switches or creates; ctrl-x kills the highlighted session in place.
# Wider than the old picker because it now carries a preview pane.
bind -N "Session switcher" f display-popup -E -w 80% -h 70% "tmux-sessionizer"


# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme. These are ANSI color *names*, so they resolve through whatever palette
# the omarchy theme gives ghostty — "blue" is currently #7daea3 (gruvbox teal).
# tmux does not follow omarchy themes automatically; to restyle, change the
# color words below. "default" means "inherit the terminal's own fg/bg".
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
